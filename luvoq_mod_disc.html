<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stimulus — Condition 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#e9edf1;min-height:100vh;display:flex;align-items:center;justify-content:center}
body{padding:24px}

/* ---------- phone mockup, always light, Instagram-like ---------- */
.phone{width:760px;max-width:100%;background:#fff;color:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.screen{height:700px;display:flex;flex-direction:column;background:#fff}
.split{flex:1;display:flex;min-height:0}
.post-pane{flex:0 0 360px;overflow-y:auto;border-right:1px solid #efefef}
.comments-pane{flex:1;min-width:0;display:flex;flex-direction:column}
.feed{flex:1;overflow-y:auto}
.post-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px}
.post-head .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.post-head .who{flex:1;min-width:0;line-height:16px}
.post-head .name{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.post-head .sub{font-size:12px;color:#000}
.vbadge{display:inline-block;width:12px;height:12px;flex:none}
.media{position:relative;width:100%;background:#efefef;overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8e8e8e;font-size:14px;text-align:center;padding:20px}
.media .count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:12px}
.cta{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 12px 0 14px;font-size:14px;font-weight:600;border-bottom:1px solid #efefef;cursor:pointer}
.cta.blue{background:#0095f6;color:#fff;border-bottom-color:#0095f6}
.cta:hover{background:rgba(0,0,0,.025)}
.cta.blue:hover{background:#0087dd}
.actions{position:relative;display:flex;align-items:center;gap:14px;padding:8px 12px 6px 14px}
.actions .sp{flex:1}
.actions svg{display:block}
.dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#dbdbdb}
.dots i.on{background:#0095f6}
.likes{font-size:14px;font-weight:600;padding:0 14px}
.likes .reg{font-weight:400}
.cap{font-size:14px;line-height:18px;padding:5px 14px 0;white-space:pre-wrap;word-wrap:break-word}
.cap b{font-weight:600}
.cap .cap-badge{vertical-align:-1px;margin-left:3px}
.cap .link{color:var(--link,#00376b)}
.viewall{font-size:14px;color:#737373;padding:5px 14px 0}
.ptime{font-size:12px;color:#737373;padding:5px 14px 16px}

.c{display:flex;gap:12px;padding:9px 16px 9px 16px}
.c.reply{padding-left:60px;gap:10px}
.c .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
.c.reply .av{width:26px;height:26px}
.c .body{flex:1;min-width:0}
.c .meta{display:flex;align-items:center;gap:4px;font-size:13px;line-height:16px}
.c .name{font-weight:600}
.c .vbadge{display:inline-block;width:12px;height:12px;flex:none}
.c .time{color:#737373;margin-left:4px;font-weight:400}
.c .text{font-size:14px;line-height:18px;margin-top:2px;white-space:pre-wrap;word-wrap:break-word}
.c .mention{color:var(--link,#00376b)}
.c .cacts{display:flex;gap:16px;margin-top:6px;font-size:12px;font-weight:600;color:#737373}
.c .like{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px;width:20px;flex:none;color:#737373;font-size:11px}

.sec-head{padding:16px 14px 6px;font-size:15px;font-weight:700}
.no-comments{color:#737373;text-align:center;padding:60px 20px;font-size:14px}
.hidden-btn{display:flex;align-items:center;gap:8px;padding:14px 16px;margin-top:10px;border-top:1px solid #efefef;font-size:12px;font-weight:600;color:#737373;cursor:pointer}
.hidden-btn:hover{background:rgba(0,0,0,.025)}
.hidden-btn svg{flex:none}
.compose{flex:none;border-top:1px solid #efefef;padding:10px 14px 14px}
.emojis{display:flex;justify-content:space-between;font-size:22px;padding:0 6px 10px}
.compose-row{display:flex;gap:10px;align-items:center}
.compose-row img{width:34px;height:34px;border-radius:50%}
.pill{flex:1;border:1px solid #dbdbdb;border-radius:22px;padding:10px 14px;color:#737373;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsl(h,s,l){return `hsl(${Math.round(h)%360},${Math.round(s)}%,${Math.round(l)}%)`}
function svgURL(s){return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}
const DEFAULT_AV=svgURL('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#dbdbdb"/><circle cx="50" cy="40" r="17" fill="#fff"/><ellipse cx="50" cy="95" rx="32" ry="28" fill="#fff"/></svg>');
function genAvatar(sd){
  const r=mulberry(sd); const h=r()*360;
  const kind=r();
  if(kind<0.34){
    let blobs='';for(let i=0;i<4;i++){blobs+=`<circle cx="${r()*100}" cy="${r()*100}" r="${25+r()*30}" fill="${hsl(h+r()*120-60,35+r()*40,35+r()*45)}"/>`}
    return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><filter id="b" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter></defs><rect width="100" height="100" fill="${hsl(h,30,55)}"/><g filter="url(#b)">${blobs}</g></svg>`);
  }
  if(kind<0.58){
    const sky1=hsl(h,55,62+r()*15),sky2=hsl(h+40,65,82),hill=hsl(h+150+r()*40,30,28+r()*12),hill2=hsl(h+160,25,42);
    const sy=30+r()*25,sx=25+r()*50;
    return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="${sx}" cy="${sy}" r="${7+r()*6}" fill="#fff7e0" opacity=".9"/><path d="M0 ${62+r()*8} Q30 ${45+r()*10} 55 ${60+r()*6} T100 ${52+r()*10} V100 H0Z" fill="${hill2}"/><path d="M0 ${78+r()*6} Q40 ${62+r()*8} 70 ${76+r()*4} T100 ${70+r()*8} V100 H0Z" fill="${hill}"/></svg>`);
  }
  if(kind<0.86){
    const bg=hsl(h,25+r()*35,55+r()*25),fg=hsl(h+20+r()*40,20+r()*20,18+r()*25);
    const cx=42+r()*16,hr=15+r()*4;
    const hair=r()<.5?`<ellipse cx="${cx}" cy="${40-hr*.2}" rx="${hr*1.15}" ry="${hr*1.25}" fill="${fg}"/>`:'';
    return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><filter id="b"><feGaussianBlur stdDeviation="1.6"/></filter><radialGradient id="g" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="100" height="100" fill="${bg}"/><rect width="100" height="100" fill="url(#g)"/><g filter="url(#b)">${hair}<circle cx="${cx}" cy="42" r="${hr}" fill="${fg}"/><ellipse cx="${cx}" cy="${98}" rx="${30+r()*6}" ry="${30}" fill="${fg}"/></g></svg>`);
  }
  const bg=hsl(h,45,80),a=hsl(h+180,55,48),b=hsl(h+120,50,60);
  return svgURL(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/><circle cx="${40+r()*20}" cy="${45+r()*15}" r="${22+r()*8}" fill="${a}"/><circle cx="${30+r()*40}" cy="${30+r()*20}" r="${8+r()*8}" fill="${b}" opacity=".9"/><rect x="0" y="${80+r()*8}" width="100" height="30" fill="${hsl(h,25,40)}" opacity=".55"/></svg>`);
}

const S='fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const HEART='M12 20.5s-7.5-4.6-9.4-9.1C1.3 8.2 3.1 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.2 1.7-2 3.1-3.2 5.3-3.2 3.6 0 5.4 3.7 4.1 6.9-1.9 4.5-9.4 9.1-9.4 9.1z';
const IC={
  heart:l=>l?`<svg width="25" height="25" viewBox="0 0 24 24"><path d="${HEART}" fill="#ff3040"/></svg>`:`<svg width="25" height="25" viewBox="0 0 24 24" ${S}><path d="${HEART}"/></svg>`,
  comment:`<svg width="24" height="24" viewBox="0 0 24 24" ${S}><path d="M20.6 16.4A9 9 0 1 0 17.3 19.7L21.3 21z"/></svg>`,
  share:`<svg width="24" height="24" viewBox="0 0 24 24" ${S}><path d="M21.5 3 9.6 10.2M21.5 3l-6.7 18-3.6-9.3L2.5 8.2z"/></svg>`,
  save:s=>`<svg width="24" height="24" viewBox="0 0 24 24" ${s?'fill="#000" stroke="#000" stroke-width="1.9" stroke-linejoin="round"':S}><path d="M19 21l-7-5.5L5 21V3h14z"/></svg>`,
  more:'<svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  chev:c=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`
};
function badge(){
  let d='';const n=16;for(let i=0;i<n*2;i++){const a=Math.PI*i/n,r=i%2?5.3:6;d+=(i?'L':'M')+(6+r*Math.sin(a)).toFixed(2)+' '+(6-r*Math.cos(a)).toFixed(2)}
  return `<svg class="vbadge" viewBox="0 0 12 12" aria-label="Verified"><path d="${d}Z" fill="#0095f6"/><path d="M3.6 6.2l1.6 1.6 3.2-3.4" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
const EYE_OFF='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-2.6 3.2M6.6 7.6C4.4 9.2 3 12 3 12s4 6 9 6c1.6 0 3-.4 4.3-1.1M9.9 10a3 3 0 0 0 4.1 4.1"/></svg>';
const EYE='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="3"/></svg>';
const HEART_O='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><path d="'+HEART+'"/></svg>';
const HEART_F='<svg width="14" height="14" viewBox="0 0 24 24" fill="#ff3040"><path d="'+HEART+'"/></svg>';

function avatarOf(o){if(o.avMode==='upload'&&o.avatar)return o.avatar;if(o.avMode==='default')return DEFAULT_AV;return genAvatar(o.avSeed)}
function isHidden(c,cm){if(cm.hidden)return true;if(cm.parentId){const p=c.comments.find(x=>x.id===cm.parentId);return !!(p&&p.hidden)}return false}
function ordered(c){const out=[];c.comments.filter(cm=>!cm.parentId).forEach(p=>{out.push(p);c.comments.filter(cm=>cm.parentId===p.id).forEach(r=>out.push(r))});return out}
function textNodes(el,str){
  str.split(/([@#][A-Za-z0-9._]+)/g).forEach(part=>{
    if(/^[@#][A-Za-z0-9._]+$/.test(part)){const sp=document.createElement('span');sp.className='mention';sp.style.color='var(--link,#00376b)';sp.textContent=part;el.appendChild(sp)}
    else if(part)el.appendChild(document.createTextNode(part));
  });
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const fmt=n=>Number(n||0).toLocaleString('en-US');
function makeCommentRow(c,cm,asReply){
  const row=document.createElement('div');row.className='c'+(asReply?' reply':'');
  const img=document.createElement('img');img.className='av';img.alt='';img.src=avatarOf(cm);row.appendChild(img);
  const body=document.createElement('div');body.className='body';
  const meta=document.createElement('div');meta.className='meta';
  const nm=document.createElement('span');nm.className='name';nm.textContent=cm.username;meta.appendChild(nm);
  if(cm.verified)meta.insertAdjacentHTML('beforeend',badge());
  const tm=document.createElement('span');tm.className='time';tm.textContent=cm.time;meta.appendChild(tm);
  body.appendChild(meta);
  const tx=document.createElement('div');tx.className='text';
  let txt=cm.text;
  if(cm.parentId&&cm.mention){const p=c.comments.find(x=>x.id===cm.parentId);if(p&&!txt.startsWith('@'+p.username))txt='@'+p.username+' '+txt}
  textNodes(tx,txt);body.appendChild(tx);
  const acts=document.createElement('div');acts.className='cacts';acts.innerHTML='<span>Reply</span>';body.appendChild(acts);
  row.appendChild(body);
  const like=document.createElement('div');like.className='like';
  like.innerHTML=(cm.liked?HEART_F:HEART_O)+(cm.likes>0?`<span>${cm.likes}</span>`:'');
  row.appendChild(like);
  return row;
}

/* ---------- hidden-comments button: toggle reveal + record every click ---------- */
const clickedReveal=new Set(); // condition ids currently showing their hidden comments (participant can toggle this back and forth)
function recordHiddenClick(c,revealedNow){
  try{window.parent.postMessage({type:'hidden_comments_click',conditionId:c.id,conditionName:c.name,revealed:revealedNow,clickedAt:Date.now()},'*')}catch(e){}
}

function render(){
  const c=cond,ad=$('#postPane'),pv=$('#preview');ad.innerHTML='';pv.innerHTML='';ad.style.setProperty('--link',c.linkColor||'#00376b');pv.style.setProperty('--link',c.linkColor||'#00376b');
  const name=(c.ad.username||'').trim().replace(/^@/,'')||'brandname';
  const h=el('div','post-head');const av=el('img','av');av.alt='';av.src=avatarOf(c.ad);h.appendChild(av);
  const who=el('div','who');const nm=el('div','name');nm.appendChild(el('span',null,name));if(c.ad.verified)nm.insertAdjacentHTML('beforeend',badge());who.appendChild(nm);
  if((c.ad.subline||'').trim())who.appendChild(el('div','sub',c.ad.subline.trim()));
  h.appendChild(who);h.insertAdjacentHTML('beforeend',IC.more);ad.appendChild(h);
  const [rw,rh]=c.ad.ratio.split('/').map(Number);const m=el('div','media');m.style.aspectRatio=rw+' / '+rh;
  const shown=Math.min(c.ad.shown||0,Math.max(0,c.ad.images.length-1));
  if(c.ad.images.length){const im=el('img');im.alt='';im.src=IMAGES[c.ad.images[shown]];m.appendChild(im);
    if(c.ad.images.length>1)m.appendChild(el('div','count',(shown+1)+'/'+c.ad.images.length));}
  else m.appendChild(el('div','ph',''));
  ad.appendChild(m);
  if(c.ad.ctaOn){const cb=el('div','cta'+(c.ad.ctaStyle==='blue'?' blue':''));cb.appendChild(el('span',null,(c.ad.ctaText||'').trim()||'Shop now'));
    cb.insertAdjacentHTML('beforeend',IC.chev(c.ad.ctaStyle==='blue'?'#fff':'#000'));
    cb.setAttribute('role','button');cb.tabIndex=0;
    const openCta=()=>{const u=(c.ad.ctaUrl||'').trim();if(u)window.open(u,'_blank','noopener')};
    cb.onclick=openCta;cb.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCta()}};
    ad.appendChild(cb)}
  const acts=el('div','actions');acts.innerHTML=IC.heart(c.ad.liked)+IC.comment+IC.share+'<span class="sp"></span>'+IC.save(c.ad.saved);
  if(c.ad.images.length>1){const d=el('div','dots');c.ad.images.forEach((_,i)=>{d.appendChild(el('i',i===shown?'on':''))});acts.appendChild(d)}
  ad.appendChild(acts);
  const lk=el('div','likes');
  if((c.ad.likedBy||'').trim()){lk.appendChild(el('span','reg','Liked by '));lk.appendChild(el('span',null,c.ad.likedBy.trim().replace(/^@/,'')));lk.appendChild(el('span','reg',' and '));lk.appendChild(el('span',null,c.ad.likes>1?'others':'1 other'))}
  else lk.textContent=fmt(c.ad.likes)+(c.ad.likes===1?' like':' likes');
  if(c.ad.likes>0||(c.ad.likedBy||'').trim())ad.appendChild(lk);
  if((c.ad.caption||'').trim()){
    const cap=el('div','cap');
    cap.appendChild(el('b',null,name));if(c.ad.verified)cap.insertAdjacentHTML('beforeend',badge().replace('class="vbadge"','class="vbadge cap-badge"'));cap.appendChild(document.createTextNode(' '));
    textNodes(cap,c.ad.caption);ad.appendChild(cap);
  }
  if(c.ad.comments>0)ad.appendChild(el('div','viewall',c.ad.comments===1?'View 1 comment':'View all '+fmt(c.ad.comments)+' comments'));
  ad.appendChild(el('div','ptime',(c.ad.time||'').trim()||'2 days ago'));
  pv.appendChild(el('div','sec-head','Comments'));
  const all=ordered(c),shownCm=all.filter(cm=>!isHidden(c,cm)),hid=all.filter(cm=>isHidden(c,cm));
  if(!shownCm.length&&!(hid.length&&c.hiddenMode&&c.hiddenMode!=='none'))pv.appendChild(el('div','no-comments','No comments yet.'));
  shownCm.forEach(cm=>pv.appendChild(makeCommentRow(c,cm,!!cm.parentId)));
  let mode=c.hiddenMode||'none';
  if(mode==='revealed')mode='button'; // migrate any condition saved before this mode was simplified away
  if(hid.length&&mode!=='none'){
    const alreadyShown=clickedReveal.has(c.id);
    const btn=el('div','hidden-btn');
    const icon=alreadyShown?EYE:EYE_OFF;
    btn.innerHTML=icon;
    const labelText=alreadyShown&&mode==='button'?'Hide comments':((c.hiddenLabel||'').trim()||'See hidden comments').replace(/\{n\}/g,hid.length);
    btn.appendChild(document.createTextNode(labelText));
    if(mode==='button'){
      btn.setAttribute('role','button');btn.tabIndex=0;
      const reveal=()=>{const nowRevealed=!clickedReveal.has(c.id);if(nowRevealed)clickedReveal.add(c.id);else clickedReveal.delete(c.id);recordHiddenClick(c,nowRevealed);render()};
      btn.onclick=reveal;btn.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}};
    }
    pv.appendChild(btn);
    if(alreadyShown){hid.forEach(cm=>{const parentHidden=cm.parentId&&hid.some(x=>x.id===cm.parentId);pv.appendChild(makeCommentRow(c,cm,!!parentHidden))})}
  }
}
$('#selfAv').src=genAvatar(4242);
render();
})();
</script>
</body>
</html>
